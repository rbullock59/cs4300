{% extends 'bookings/base.html' %}
{% block title %}Book a Seat{% endblock %}
{% block content %}
<h2 class="mb-1">{{ movie.title }}</h2>
<p class="text-muted">{{ movie.release_date }} &middot; {{ movie.duration }} min</p>
<form method="post">
    {% csrf_token %}
    <div class="row row-cols-4 row-cols-md-6 g-2 mb-4">
        {% for seat in seats %}
        <div class="col">
            <label class="btn btn-outline-{% if seat.is_booked %}secondary disabled{% else %}success{% endif %} w-100">
                <input type="radio" name="seat_id" value="{{ seat.id }}" class="d-none"
                       {% if seat.is_booked %}disabled{% endif %} required>
                {{ seat.seat_number }}
            </label>
        </div>
        {% empty %}
        <p>No seats configured yet.</p>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary">Confirm Booking</button>
</form>
{% endblock %}
